<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive & Accessible Gallery</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>Nature & Architecture Gallery</h1>
  </header>

  <main>
    <div class="gallery">
      <figure>
        <img src="https://picsum.photos/id/1015/600/400" alt="Mountain valley lake reflecting clear blue sky">
        <figcaption>
          <p>Explore high-altitude mountain lakes surrounded by ancient granite cliffs and dense pine forests.</p>
        </figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/id/1018/600/400" alt="Snowy mountain peaks emerging above cloud layer">
        <figcaption>
          <p>Discover alpine environments where rocky peaks reach beyond the clouds into crisp atmosphere.</p>
        </figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/id/1039/600/400" alt="Cascading waterfall hidden within lush green rainforest">
        <figcaption>
          <p>Experience deep tropical rainforests featuring pristine waterfalls flowing over mossy cliffs.</p>
        </figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/id/1043/600/400" alt="Winding ocean coastal highway overlooking blue sea">
        <figcaption>
          <p>Travel along rugged ocean coastline roads offering breathtaking views of crashing waves below.</p>
        </figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/id/1050/600/400" alt="Sunbeams filtering through tall forest canopy trees">
        <figcaption>
          <p>Walk through old-growth woodlands illuminated by warm morning sunlight passing through branches.</p>
        </figcaption>
      </figure>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Responsive Web Design Project</p>
  </footer> 

</body>
</html>
