<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Interactive Photo Gallery</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/gallery.js" defer></script>
</head>
<body onload="addTabFocus()">

  <header>
    <h1>Accessible Photo Gallery</h1>
  </header>

  <main id="main">
    <div id="image">
      Hover over or tab to an image below to display here.
    </div>

    <div class="gallery">
      <img class="preview" 
           alt="Serene lake during sunset" 
           src="https://picsum.photos/id/1015/600/400" 
           onmouseover="upDate(this)" 
           onmouseleave="undo()" 
           onfocus="upDate(this)" 
           onblur="undo()">

      <img class="preview" 
           alt="Mist-covered mountain peaks" 
           src="https://picsum.photos/id/1018/600/400" 
           onmouseover="upDate(this)" 
           onmouseleave="undo()" 
           onfocus="upDate(this)" 
           onblur="undo()">

      <img class="preview" 
           alt="Waterfall flowing through green forest" 
           src="https://picsum.photos/id/1039/600/400" 
           onmouseover="upDate(this)" 
           onmouseleave="undo()" 
           onfocus="upDate(this)" 
           onblur="undo()">

      <img class="preview" 
           alt="Scenic coastal highway beside ocean" 
           src="https://picsum.photos/id/1043/600/400" 
           onmouseover="upDate(this)" 
           onmouseleave="undo()" 
           onfocus="upDate(this)" 
           onblur="undo()">

      <img class="preview" 
           alt="Sunlight streaming through tall trees" 
           src="https://picsum.photos/id/1050/600/400" 
           onmouseover="upDate(this)" 
           onmouseleave="undo()" 
           onfocus="upDate(this)" 
           onblur="undo()">

      <img class="preview" 
           alt="Person standing on hilltop at dusk" 
           src="https://picsum.photos/id/1062/600/400" 
           onmouseover="upDate(this)" 
           onmouseleave="undo()" 
           onfocus="upDate(this)" 
           onblur="undo()">
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Accessible Gallery Project</p>
  </footer>

</body>
</html>
